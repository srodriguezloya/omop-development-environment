  # Runs ETL-Synthea in R inside Docker
  etl-synthea:
    build:
      context: ./synthea
      dockerfile: Dockerfile
    container_name: omop-etl-synthea
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNTHEA_DB_URI: jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB:-ohdsi}?user=${POSTGRES_USER:-ohdsi_admin}&password=${POSTGRES_PASSWORD:-changeme}
      SYNTHEA_RAW_SCHEMA: ${SYNTHEA_SCHEMA:-synthea_native}
      SYNTHEA_CDM_SCHEMA: ${DATASOURCE_CDM_SCHEMA:-cdm}
      SYNTHEA_FILE: /data/synthea_csv
    volumes:
      - ./sample-data/synthea-output/csv:/data/synthea_csv:ro
      - ./synthea/etl-synthea.R:/app/etl-synthea.R:ro
    networks:
      - ohdsi-network
    profiles:
      - tools
    command: [ "Rscript", "/app/etl-synthea.R" ]
    restart: "no"  # Don't auto-restart - this is a one-time job

