
services:
  postgres:
    image: postgres:13-alpine
    container_name: omop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ohdsi}
      POSTGRES_USER: ${POSTGRES_USER:-ohdsi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
      - ./sample-data:/sample-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ohdsi_admin} -d $${POSTGRES_DB:-ohdsi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ohdsi-network
    restart: unless-stopped

  # OHDSI WebAPI - REST API for OMOP
  webapi:
    image: ohdsi/webapi:2.15.1
    container_name: omop-webapi
    environment:
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ohdsi}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-ohdsi_admin}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      DATASOURCE_CDM_SCHEMA: ${DATASOURCE_CDM_SCHEMA:-cdm}
      DATASOURCE_OHDSI_SCHEMA: ${DATASOURCE_OHDSI_SCHEMA:-ohdsi}
      DATASOURCE_COHORT_SCHEMA: ${DATASOURCE_COHORT_SCHEMA:-ohdsi_results}
      DATASOURCE_RESULTS_SCHEMA: ${DATASOURCE_RESULTS_SCHEMA:-ohdsi_results}

      # Spring Batch table prefix
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: ${DATASOURCE_OHDSI_SCHEMA:-ohdsi}.BATCH_

      FLYWAY_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLYWAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ohdsi}
      FLYWAY_DATASOURCE_USERNAME: ${POSTGRES_USER:-ohdsi_admin}
      FLYWAY_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FLYWAY_SCHEMAS: ${FLYWAY_SCHEMAS:-ohdsi}
      FLYWAY_PLACEHOLDERS_OHDSISCHEMA: ${DATASOURCE_OHDSI_SCHEMA:-ohdsi}

      SECURITY_ENABLED: "false"
      SECURITY_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/WebAPI/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - ohdsi-network
    restart: always

  # OHDSI Atlas - Web UI
  atlas:
    image: ohdsi/atlas:latest
    container_name: omop-atlas
    environment:
      WEBAPI_URL: http://webapi:8080/WebAPI/
      ATLAS_INSTANCE_NAME: ${ATLAS_INSTANCE_NAME:-OMOP Development}
      ATLAS_COHORT_COMPARISON_RESULTS_ENABLED: ${ATLAS_COHORT_COMPARISON_RESULTS_ENABLED:-true}
      ATLAS_USER_AUTH_ENABLED: ${ATLAS_USER_AUTH_ENABLED:-false}
    ports:
      - "8081:80"
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ohdsi-network
    restart: unless-stopped

  # Achilles - Data Quality Dashboard (optional - run on demand)
  achilles:
    image: ohdsi/achilles:latest
    container_name: omop-achilles
    environment:
      ACHILLES_DB_URI: postgresql://${POSTGRES_USER:-ohdsi_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ohdsi}
      ACHILLES_CDM_SCHEMA: ${DATASOURCE_OHDSI_SCHEMA:-ohdsi}
      ACHILLES_VOCAB_SCHEMA: ${DATASOURCE_OHDSI_SCHEMA:-ohdsi}
      ACHILLES_RESULTS_SCHEMA: ${ACHILLES_RESULTS_SCHEMA:-ohdsi_results}
      ACHILLES_CDM_VERSION: ${OMOP_CDM_VERSION:-5.4}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ohdsi-network
    profiles:
      - tools  # Only starts when explicitly requested with --profile tools
    command: ["R", "-e", "Achilles::achilles()"]

  # Runs ETL-Synthea in R inside Docker
  etl-synthea:
    image: r-base:latest
    container_name: omop-etl-synthea
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sample-data/synthea-output/csv:/synthea_csv:ro
      - ./sample-data/vocabulary:/vocabulary:ro
      - ./scripts/etl-synthea.R:/etl-synthea.R:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ohdsi}
      POSTGRES_USER: ${POSTGRES_USER:-ohdsi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      CDM_SCHEMA: cdm
      SYNTHEA_SCHEMA: synthea_native
      VOCAB_DIR: /vocabulary
      SYNTHEA_CSV_DIR: /synthea_csv
    working_dir: /
    command: >
      bash -c "
        R -e '
          options(repos = c(CRAN = \"https://cran.r-project.org\"));
          if (!require(\"devtools\")) install.packages(\"devtools\");
          if (!require(\"DatabaseConnector\")) install.packages(\"DatabaseConnector\");
          devtools::install_github(\"OHDSI/ETL-Synthea\");
          source(\"/etl-synthea.R\")
        '
      "
    profiles:
      - tools  # Only runs when you explicitly call it

volumes:
  postgres-data:
    name: omop-postgres-data
    driver: local

networks:
  ohdsi-network:
    name: omop-network
    driver: bridge